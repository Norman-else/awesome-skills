# navi-testing scenarios
#
# One list entry per scenario. The skill runs them top to bottom and judges each
# on three layers (reaction + reply + dev trace). Validate before running:
#     python3 validate_scenarios.py
#
# Fields:
#   id       (required)  T-<NNN>, unique, sequential from T-001 (pattern ^T-[0-9]{3}$)
#   title    (required)  short human label
#   message  (required)  exact text to send; the skill prepends only @Navi (no
#                        test marker — the message ts is the trace correlation key)
#   expect   (required)  plain language: what a correct reply conveys + what Navi
#                        should / must NOT do. Do NOT hand-write exact tool names
#                        or status strings — they drift; let the judge map intent.
#   agents   (optional)  the specialist sub-agent(s) that MUST be dispatched and
#                        run cleanly — names only (free-form, not enum-checked).
#                        A list: [default] or [business-data-analyst, data-viz-renderer].
#                        Use [none] to assert NO delegation (Navi answers directly).
#                        Agent routing is the ONE exact assertion worth making — it
#                        is the behavior under test and the agent set is small/stable.
#   note     (optional)  sandbox scope, cleanup, a special terminal state, or an
#                        "agent unconfirmed — lock on first run" caveat.
#   in_thread_of (optional)  another scenario id (T-0XX) defined EARLIER in this
#                        file. Sends this scenario as a reply INSIDE that
#                        scenario's Slack thread instead of a fresh top-level
#                        message — for multi-turn / context-continuation tests
#                        (the follow-up relies on the thread's prior context).
#                        The referenced scenario is auto-included as a
#                        prerequisite when you run a subset.

- id: T-001
  title: capability ping
  message: "What can you help me with?"
  expect: >-
    A short, coherent capability summary.
  agents: [none]

- id: T-002
  title: list my tickets
  message: "Show me the open Jira tickets assigned to me, just the keys and titles."
  expect: >-
    A list of issue keys + titles (or a clear "none found").
  agents: [default]

- id: T-003
  title: epic progress (read-only)
  message: "What's the progress on epic PSOS-3786?"
  expect: >-
    A progress summary for that epic (done/total or %).
  agents: [none]

- id: T-004
  title: create a new ticket
  message: "Create a new ticket with the title 'Navi - Test ticket' and the description 'This is a test ticket'"
  expect: >-
    A confirmation that the ticket was created.
  agents: [default]

- id: T-005
  title: assign the just-created ticket to me
  in_thread_of: T-004
  message: "Assign it to me"
  expect: >-
    A confirmation that the ticket from this thread was assigned to me. Navi
    should resolve "it" from the thread context (the 'Navi - Test ticket' that
    T-004 just created) rather than asking which ticket.
  agents: [none]

- id: T-006
  title: assign the ticket to the Polaris team
  in_thread_of: T-004
  message: "Now also assign it to the Polaris team"
  expect: >-
    A confirmation that the same ticket from this thread was assigned to the
    Polaris team. Navi should resolve "it" from the thread context, not ask which
    ticket.
  agents: [none]

- id: T-007
  title: add the ticket to the current sprint
  in_thread_of: T-004
  message: "And add it to that team's current sprint"
  expect: >-
    A confirmation that the same ticket was added to the Polaris team's current
    sprint. Navi resolves "it" and "that team" (Polaris) from the thread context.
  agents: [none]

- id: T-008
  title: Show me all tickets in current sprint of Polaris team
  message: "Show me all tickets in current sprint of Polaris team"
  expect: >-
    A list of tickets in the current sprint of Polaris team.
  agents: [none]

- id: T-009
  title: PR details
  message: "Summarize PR #365 in infrastructure-modules: what does it change and is it ready to merge?"
  expect: >-
    A summary of the PR's purpose/changes plus a merge-readiness read.
  agents: [none]

- id: T-010
  title: code search (read-only)
  message: "Show me the current cpu and memory configuration of opsy in infra module"
  expect: >-
    The correct cpu and memory configuration for the opsy in infra module.
  agents: [infra-explorer]

- id: T-011
  title: query the release deployment
  message: "What features are in the latest release of the ims?"
  expect: >-
    The features in the latest release of the ims.
  agents: [deployment-release]

- id: T-012
  title: query the confluence page
  message: "Is there have any page related to the VPN?"
  expect: >-
    Describe the pages related to the VPN in a list.
  agents: [none]

- id: T-013
  title: transition the ticket to In Progress
  in_thread_of: T-004
  message: "Move it to In Progress"
  expect: >-
    A confirmation that the ticket from this thread was transitioned to the
    'In Progress' status. Navi resolves "it" from the thread context.
  agents: [none]

- id: T-014
  title: Analyze the GMV of last two weeks, and give me a report and generate a chart of the GMV of last two weeks
  message: "Analyze the GMV of last two weeks, and give me a report and generate a chart of the GMV of last two weeks"
  expect: >-
    A report and a chart of the GMV of last two weeks.
  agents: [business-data-analyst, data-viz-renderer]

- id: T-015
  title: Create a new release of infra module
  message: "Create a new release of infra module"
  expect: >-
    A plan to create a new release of infra module that needs human approval.
  agents: [infra-release-executor]

- id: T-016
  title: Create a new release of infra module directly without a plan
  message: "Create a new release of infra module directly without a plan"
  expect: >-
    A confirmation that the release was created directly without a plan.
  agents: [infra-release-executor]

- id: T-017
  title: analyze Navi cpu/mem in dev (last 24h)
  message: "Analyze the CPU and memory usage of the Navi service in dev over the last 24 hours"
  expect: >-
    A report of the Navi service's CPU and memory usage in dev over the last 24
    hours. Navi runs only in dev, so naming the env lets diagnostics-explorer
    scope and report without asking which environment.
  agents: [diagnostics-explorer]

- id: T-018
  title: any issues with the Navi service in dev (last 24h)
  message: "Are there any issues with the Navi service in dev in the last 24 hours?"
  expect: >-
    A report of any issues (or a clean bill of health) for the Navi service in
    dev over the last 24 hours.
  agents: [diagnostics-explorer]

- id: T-019
  title: analyze IMS jvm metrics in prod (last 24h)
  message: "Analyze the jvm metrics of the ims service in prod over the last 24 hours"
  expect: >-
    A report of the ims service's jvm metrics in prod over the last 24 hours
    (scoped to one environment, not blended across envs).
  agents: [diagnostics-explorer]

- id: T-020
  title: analyze the latest RUM session replay
  message: "Analyze the latest RUM session replay"
  expect: >-
    An analysis of the most recent RUM Session Replay (a recorded user web
    session) — not a chat/agent "reply". Routes to diagnostics-explorer's RUM
    capability.
  agents: [diagnostics-explorer]