# navi-testing scenarios
#
# One list entry per scenario. The skill runs them top to bottom and judges each
# on three layers (reaction + reply + dev trace). Validate before running:
#     python3 validate_scenarios.py
#
# Fields:
#   id       (required)  kebab-case, unique, e.g. jira-001
#   title    (required)  short human label
#   message  (required)  exact text to send; the skill prepends @Navi + a nonce
#   expect   (required)  plain language: what a correct reply conveys + what Navi
#                        should / must NOT do. Do NOT hand-write exact tool names
#                        or status strings — they drift; let the judge map intent.
#   agents   (optional)  the specialist sub-agent(s) that MUST be dispatched and
#                        run cleanly — names only (see scenarios.schema.json enum).
#                        A list: [default] or [business-data-analyst, data-viz-renderer].
#                        Use [none] to assert NO delegation (Navi answers directly).
#                        Agent routing is the ONE exact assertion worth making — it
#                        is the behavior under test and the agent set is small/stable.
#   note     (optional)  sandbox scope, cleanup, a special terminal state, or an
#                        "agent unconfirmed — lock on first run" caveat.
#
# Adding a brand-new agent? add its name to the enum in scenarios.schema.json.

- id: live-001
  title: capability ping
  message: "In one line, what can you help me with?"
  expect: >-
    A short, coherent capability summary; no error. Pure message -> LLM -> reply
    path, no tools called. Catches model/creds/wiring breakage /health can't.
  agents: [none]

- id: jira-001
  title: list my tickets
  message: "Show me the open Jira tickets assigned to me, just the keys and titles."
  expect: >-
    A list of issue keys + titles (or a clear "none found"). Read-only: Navi does
    the Jira lookup, no writes, finishes clean.
  agents: [default]

- id: jira-002
  title: epic progress (read-only)
  message: "What's the progress on epic PSOS-3786?"
  expect: >-
    A progress summary for that epic (done/total or %). Read-only, no writes, no errors.
  agents: [default]

- id: pr-001
  title: PR details
  message: "Summarize PR #365 in Mercaso/infrastructure-modules: what does it change and is it ready to merge?"
  expect: >-
    A summary of the PR's purpose/changes plus a merge-readiness read. Read-only,
    no writes, no errors.
  agents: [infra-explorer]

- id: repo-001
  title: code search (read-only)
  message: "Show me the current cpu and memory configuration of opsy in infra module"
  expect: >-
    The correct cpu and memory configuration for the opsy in infra module. MUST NOT edit, write, commit, or push
    anything — a read request must never trigger a write.
  agents: [infra-explorer]
