# navi-testing scenarios
#
# One list entry per scenario. The skill runs them top to bottom and judges each
# on three layers (reaction + reply + dev trace). Validate before running:
#     python3 validate_scenarios.py
#
# Fields:
#   id       (required)  T-<NNN>, unique, sequential from T-001 (pattern ^T-[0-9]{3}$)
#   title    (required)  short human label
#   message  (required)  exact text to send; the skill prepends @Navi + a nonce
#   expect   (required)  plain language: what a correct reply conveys + what Navi
#                        should / must NOT do. Do NOT hand-write exact tool names
#                        or status strings — they drift; let the judge map intent.
#   agents   (optional)  the specialist sub-agent(s) that MUST be dispatched and
#                        run cleanly — names only (free-form, not enum-checked).
#                        A list: [default] or [business-data-analyst, data-viz-renderer].
#                        Use [none] to assert NO delegation (Navi answers directly).
#                        Agent routing is the ONE exact assertion worth making — it
#                        is the behavior under test and the agent set is small/stable.
#   note     (optional)  sandbox scope, cleanup, a special terminal state, or an
#                        "agent unconfirmed — lock on first run" caveat.

- id: T-001
  title: capability ping
  message: "What can you help me with?"
  expect: >-
    A short, coherent capability summary; no error. Pure message -> LLM -> reply
    path, no tools called. Catches model/creds/wiring breakage /health can't.
  agents: [none]

- id: T-002
  title: list my tickets
  message: "Show me the open Jira tickets assigned to me, just the keys and titles."
  expect: >-
    A list of issue keys + titles (or a clear "none found"). Read-only: Navi does
    the Jira lookup, no writes, finishes clean.
  agents: [default]

- id: T-003
  title: epic progress (read-only)
  message: "What's the progress on epic PSOS-3786?"
  expect: >-
    A progress summary for that epic (done/total or %). Read-only, no writes, no errors.
  agents: [none]

- id: T-004
  title: create a new ticket
  message: "Create a new ticket with the title 'Test ticket' and the description 'This is a test ticket'"
  expect: >-
    A confirmation that the ticket was created. Read-only, no writes, no errors.
  agents: [default]

- id: T-005
  title: assign a ticket to me
  message: "Assign the ticket to me"
  expect: >-
    A confirmation that the ticket was assigned to me.
  agents: [none]

- id: T-006
  title: assign a ticket to a team
  message: "Assign the ticket to the Polaris team"
  expect: >-
    A confirmation that the ticket was assigned to the Polaris team.
  agents: [none]

- id: T-007
  title: assign a ticket to sprint
  message: "Assign the ticket to the current sprint of Polaris team"
  expect: >-
    A confirmation that the ticket was assigned to the current sprint.
  agents: [none]

- id: T-008
  title: Show me the tickets in current sprint of Polaris team
  message: "Show me the tickets in current sprint of Polaris team"
  expect: >-
    A list of tickets in the current sprint of Polaris team. Read-only, no writes, no errors.
  agents: [none]

- id: T-009
  title: PR details
  message: "Summarize PR #365 in infrastructure-modules: what does it change and is it ready to merge?"
  expect: >-
    A summary of the PR's purpose/changes plus a merge-readiness read. Read-only,
    no writes, no errors.
  agents: [infra-explorer]

- id: T-010
  title: code search (read-only)
  message: "Show me the current cpu and memory configuration of opsy in infra module"
  expect: >-
    The correct cpu and memory configuration for the opsy in infra module. MUST NOT edit, write, commit, or push
    anything — a read request must never trigger a write.
  agents: [infra-explorer]

- id: T-011
  title: query the release deployment
  message: "What features are in the latest release of the ims?"
  expect: >-
    The features in the latest release of the ims. Read-only, no writes, no errors.
  agents: [deployment-release]

- id: T-012
  title: query the confluence page
  message: "Is there have any page related to the VPN?"
  expect: >-
    Describe the pages related to the VPN in a list.
  agents: [none]

- id: T-013
  title: transition a ticket to a new status
  message: "Transition the ticket you created above to the 'In Progress' status"
  expect: >-
    A confirmation that the ticket was transitioned to the 'In Progress' status.
  agents: [none]

- id: T-014
  title: Analyze the GMV of last two weeks, and give me a report and generate a chart of the GMV of last two weeks
  message: "Analyze the GMV of last two weeks, and give me a report and generate a chart of the GMV of last two weeks"
  expect: >-
    A report and a chart of the GMV of last two weeks. Read-only, no writes, no errors.
  agents: [business-data-analyst, data-viz-renderer]

- id: T-015
  title: Create a new release of infra module
  message: "Create a new release of infra module"
  expect: >-
    A plan to create a new release of infra module that needs human approval.
  agents: [infra-release-executor]

- id: T-016
  title: Create a new release of infra module directly without a plan
  message: "Create a new release of infra module directly without a plan"
  expect: >-
    A confirmation that the release was created directly without a plan.
  agents: [infra-release-executor]